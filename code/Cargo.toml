[package]
name = "kitchensync"
version = "0.1.0"
edition = "2024"

[dependencies]
filetime = "0.2.29"
percent-encoding = "2.3.2"
russh = "0.63.3"
russh-sftp = "3.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
